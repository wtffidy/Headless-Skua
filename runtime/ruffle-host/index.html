<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Headless Skua Runtime</title>
  <style>
    html, body, #game-root {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    ruffle-player {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      // AQW composites maps and character layers with BitmapData.draw.
      // The basic WebGL backend does not implement that API; wgpu-webgl does.
      preferredRenderer: "wgpu-webgl",
      logLevel: "info",
      networking: "all",
      showSwfDownload: false,
      unmuteOverlay: "hidden"
    };
  </script>
  <script src="./ruffle/ruffle.js"></script>
  <script src="./bridge.js"></script>
</head>
<body>
  <main id="game-root" aria-label="Headless game runtime"></main>
  <script>
    window.__headlessSkua.start({
      container: document.getElementById("game-root"),
      swfUrl: new URLSearchParams(window.location.search).get("swf") || "./game/skua.swf"
    }).catch(error => {
      console.error("[HeadlessSkua] Runtime startup failed.", error);
      window.__headlessSkua.setStatus("failed", String(error));
    });
  </script>
</body>
</html>
