name: Build

concurrency:
  group: headless-skua-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore HeadlessSkua.sln

      - name: Build
        run: dotnet build HeadlessSkua.sln --configuration Release --no-restore

      - name: Install Playwright Chromium
        shell: pwsh
        run: ./src/HeadlessSkua.Host/bin/Release/net10.0/playwright.ps1 install chromium

      - name: Install Ruffle Web runtime
        shell: pwsh
        run: ./runtime/ruffle-host/Install-Runtime.ps1

      - name: Check host diagnostics
        run: dotnet run --project src/HeadlessSkua.Host --configuration Release --no-build -- doctor

      - name: Publish standalone Windows host
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "headless-skua-publish"
          dotnet publish src/HeadlessSkua.Host/HeadlessSkua.Host.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=embedded -o $publishDir
          if ($LASTEXITCODE -ne 0) { throw "Publishing the standalone host failed." }

          $driverSource = "src/HeadlessSkua.Host/bin/Release/net10.0/.playwright"
          if (-not (Test-Path (Join-Path $driverSource "node/win32_x64/node.exe"))) { throw "Playwright Node driver is missing from the build output." }
          if (-not (Test-Path (Join-Path $driverSource "package/cli.js"))) { throw "Playwright CLI is missing from the build output." }
          $publishedDriver = Join-Path $publishDir ".playwright"
          $publishedRuntime = Join-Path $publishDir "runtime/ruffle-host"
          New-Item -ItemType Directory -Path $publishedDriver -Force | Out-Null
          New-Item -ItemType Directory -Path $publishedRuntime -Force | Out-Null
          Copy-Item (Join-Path $driverSource "*") $publishedDriver -Recurse -Force
          Copy-Item "runtime/ruffle-host/*" $publishedRuntime -Recurse -Force

          if (-not (Test-Path (Join-Path $publishDir "panel/index.html"))) { throw "Remote panel assets were not published." }
          if (-not (Test-Path (Join-Path $publishDir ".playwright/node/win32_x64/node.exe"))) { throw "Published Playwright Node driver is missing." }
          & (Join-Path $publishDir "HeadlessSkua.exe") doctor
          if ($LASTEXITCODE -ne 0) { throw "Published host diagnostics failed." }

      - name: Smoke test published Headless Skua startup
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "headless-skua-publish"
          $stdout = Join-Path $env:RUNNER_TEMP "headless-skua-runtime.out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "headless-skua-runtime.err.log"
          $smokeScript = (Resolve-Path "tests/Smoke/HeadlessSmoke.cs").Path
          $arguments = @("run", "--script", $smokeScript, "--skip-login")
          $process = Start-Process -FilePath (Join-Path $publishDir "HeadlessSkua.exe") -ArgumentList $arguments -WorkingDirectory $publishDir -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(90)
            $started = $false

            while ([DateTime]::UtcNow -lt $deadline) {
              if (Test-Path $stdout) {
                $output = Get-Content $stdout -Raw
                if ($output -match "Remote panel listening on port 8788" -and $output -match "Headless Skua script engine smoke test passed." -and $output -match "Script execution stopped.") {
                  $started = $true
                  break
                }
              }

              if ($process.HasExited) {
                break
              }

              Start-Sleep -Seconds 1
            }

            if (-not $started) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw "The Skua SWF or existing Skua script engine did not initialize in headless Chromium within 90 seconds."
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }
