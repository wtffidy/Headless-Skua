name: Build

concurrency:
  group: headless-skua-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore HeadlessSkua.sln

      - name: Build
        run: dotnet build HeadlessSkua.sln --configuration Release --no-restore

      - name: Install Playwright Chromium
        shell: pwsh
        run: ./src/HeadlessSkua.Host/bin/Release/net10.0/playwright.ps1 install chromium

      - name: Install Ruffle Web runtime
        shell: pwsh
        run: ./runtime/ruffle-host/Install-Runtime.ps1

      - name: Check host diagnostics
        run: dotnet run --project src/HeadlessSkua.Host --configuration Release --no-build -- doctor

      - name: Publish standalone Windows host
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "headless-skua-publish"
          dotnet publish src/HeadlessSkua.Host/HeadlessSkua.Host.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=embedded -o $publishDir
          if ($LASTEXITCODE -ne 0) { throw "Publishing the standalone host failed." }

          $driverSource = "src/HeadlessSkua.Host/bin/Release/net10.0/.playwright"
          if (-not (Test-Path (Join-Path $driverSource "node/win32_x64/node.exe"))) { throw "Playwright Node driver is missing from the build output." }
          if (-not (Test-Path (Join-Path $driverSource "package/cli.js"))) { throw "Playwright CLI is missing from the build output." }
          $publishedDriver = Join-Path $publishDir ".playwright"
          $publishedRuntime = Join-Path $publishDir "runtime/ruffle-host"
          New-Item -ItemType Directory -Path $publishedDriver -Force | Out-Null
          New-Item -ItemType Directory -Path $publishedRuntime -Force | Out-Null
          Copy-Item (Join-Path $driverSource "*") $publishedDriver -Recurse -Force
          Copy-Item "runtime/ruffle-host/*" $publishedRuntime -Recurse -Force

          if (-not (Test-Path (Join-Path $publishDir "panel/index.html"))) { throw "Remote panel assets were not published." }
          if (-not (Test-Path (Join-Path $publishDir ".playwright/node/win32_x64/node.exe"))) { throw "Published Playwright Node driver is missing." }
          & (Join-Path $publishDir "HeadlessSkua.exe") doctor
          if ($LASTEXITCODE -ne 0) { throw "Published host diagnostics failed." }

      - name: Smoke test remote panel API
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "headless-skua-publish"
          $stdout = Join-Path $env:RUNNER_TEMP "headless-skua-panel.out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "headless-skua-panel.err.log"
          $process = Start-Process -FilePath (Join-Path $publishDir "HeadlessSkua.exe") -ArgumentList @("run", "--skip-login", "--quiet") -WorkingDirectory $publishDir -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $client = [System.Net.Http.HttpClient]::new()
          $client.Timeout = [TimeSpan]::FromSeconds(5)

          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(90)
            $status = $null

            while ([DateTime]::UtcNow -lt $deadline) {
              if ($process.HasExited) {
                throw "Headless Skua exited before the panel API became available."
              }

              try {
                $response = $client.GetAsync("http://127.0.0.1:8788/api/status").GetAwaiter().GetResult()
                if ($response.IsSuccessStatusCode) {
                  $status = $response.Content.ReadAsStringAsync().GetAwaiter().GetResult() | ConvertFrom-Json
                  break
                }
              }
              catch {
              }

              Start-Sleep -Seconds 1
            }

            if ($null -eq $status) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw "The remote panel status API did not become ready."
            }

            if ($status.connected -ne $false -or $status.runtime -ne "Not logged in") {
              throw "The panel did not report the expected unauthenticated game state."
            }
            if ([string]::IsNullOrWhiteSpace($status.connectionMessage)) {
              throw "The panel status response is missing its connection explanation."
            }
            if ($null -eq $status.PSObject.Properties["butlerAvailable"]) {
              throw "The panel status response is missing Butler availability."
            }

            $scriptsResponse = $client.GetAsync("http://127.0.0.1:8788/api/scripts").GetAwaiter().GetResult()
            if (-not $scriptsResponse.IsSuccessStatusCode) {
              throw "The installed-script API did not return HTTP 200."
            }
            $scripts = $scriptsResponse.Content.ReadAsStringAsync().GetAwaiter().GetResult() | ConvertFrom-Json
            if ($null -eq $scripts.folders -or $null -eq $scripts.files -or $scripts.root -ne "Scripts") {
              throw "The Scripts explorer API response is missing its folders or files."
            }

            $page = $client.GetStringAsync("http://127.0.0.1:8788/").GetAwaiter().GetResult()
            if ($page -notmatch "Panel API online" -or $page -notmatch "connectionHint" -or $page -notmatch "browseScripts" -or $page -notmatch "explorerBackdrop" -or $page -notmatch "loginState" -or $page -notmatch "worldState") {
              throw "The published panel page is missing its login-state or folder-explorer UI."
            }

            $scriptBody = [System.Net.Http.StringContent]::new('{"path":"C:/HeadlessSmoke/missing.cs"}', [System.Text.Encoding]::UTF8, "application/json")
            $scriptResponse = $client.PostAsync("http://127.0.0.1:8788/api/script/start", $scriptBody).GetAwaiter().GetResult()
            $scriptError = $scriptResponse.Content.ReadAsStringAsync().GetAwaiter().GetResult()
            if ([int]$scriptResponse.StatusCode -ne 409 -or $scriptError -notmatch "AQW is not ready") {
              throw "The panel script API did not return the expected not-connected response: $scriptError"
            }

            $butlerBody = [System.Net.Http.StringContent]::new('{"username":"HeadlessSmokeTarget","duration":null}', [System.Text.Encoding]::UTF8, "application/json")
            $butlerResponse = $client.PostAsync("http://127.0.0.1:8788/api/butler/start", $butlerBody).GetAwaiter().GetResult()
            $butlerError = $butlerResponse.Content.ReadAsStringAsync().GetAwaiter().GetResult()
            if ([int]$butlerResponse.StatusCode -ne 409 -or $butlerError -notmatch "AQW is not ready") {
              throw "The panel Butler API did not return the expected not-connected response: $butlerError"
            }

            Write-Host "Remote panel API smoke test passed."
          }
          finally {
            $client.Dispose()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }

      - name: Smoke test published Headless Skua startup
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "headless-skua-publish"
          $stdout = Join-Path $env:RUNNER_TEMP "headless-skua-runtime.out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "headless-skua-runtime.err.log"
          $smokeScript = (Resolve-Path "tests/Smoke/HeadlessSmoke.cs").Path
          $arguments = @("run", "--script", $smokeScript, "--skip-login", "--quiet")
          $process = Start-Process -FilePath (Join-Path $publishDir "HeadlessSkua.exe") -ArgumentList $arguments -WorkingDirectory $publishDir -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(90)
            $started = $false

            while ([DateTime]::UtcNow -lt $deadline) {
              if (Test-Path $stdout) {
                $output = Get-Content $stdout -Raw
                if ($output -match "Remote panel listening on port 8788" -and $output -match "Headless Skua script engine smoke test passed." -and $output -match "Script execution stopped.") {
                  $started = $true
                  break
                }
              }

              if ($process.HasExited) {
                break
              }

              Start-Sleep -Seconds 1
            }

            if (-not $started) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw "The Skua SWF or existing Skua script engine did not initialize in headless Chromium within 90 seconds."
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }
