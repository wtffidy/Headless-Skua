name: Build

concurrency:
  group: headless-skua-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore HeadlessSkua.sln

      - name: Build
        run: dotnet build HeadlessSkua.sln --configuration Release --no-restore

      - name: Install Playwright Chromium
        shell: pwsh
        run: ./src/HeadlessSkua.Host/bin/Release/net10.0/playwright.ps1 install chromium

      - name: Install Ruffle Web runtime
        shell: pwsh
        run: ./runtime/ruffle-host/Install-Runtime.ps1

      - name: Check host diagnostics
        run: dotnet run --project src/HeadlessSkua.Host --configuration Release --no-build -- doctor

      - name: Smoke test headless Skua startup
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "headless-skua-runtime.out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "headless-skua-runtime.err.log"
          $arguments = @("run", "--project", "src/HeadlessSkua.Host", "--configuration", "Release", "--no-build", "--", "run")
          $process = Start-Process -FilePath "dotnet" -ArgumentList $arguments -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(90)
            $started = $false

            while ([DateTime]::UtcNow -lt $deadline) {
              if (Test-Path $stdout) {
                $output = Get-Content $stdout -Raw
                if ($output -match "Skua ActionScript client initialized") {
                  $started = $true
                  break
                }
              }

              if ($process.HasExited) {
                break
              }

              Start-Sleep -Seconds 1
            }

            if (-not $started) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw "The Skua SWF did not initialize in headless Chromium within 90 seconds."
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }
